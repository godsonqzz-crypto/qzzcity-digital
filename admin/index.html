<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>QzzCity Digital Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#101725;--panel2:#141e2d;--gold:#d9b568;--blue:#5ba8ff;--muted:#9eabc0;--line:#263246;--white:#f7f8fb;--green:#55c99a;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px "DM Sans",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,rgba(91,168,255,.13),transparent 42%)}
.login-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 24px 80px #0008}.brand{font:800 1.5rem Manrope,sans-serif}.brand span{color:var(--gold)}.eyebrow{color:var(--blue);font-size:.72rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin:9px 0 25px}
h1,h2,h3{font-family:Manrope,sans-serif}h1{font-size:1.65rem;margin:0 0 8px}p{color:var(--muted);line-height:1.65}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:.82rem;color:#c8d1df}.field input,.field textarea,.field select{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:12px;color:white;outline:none}.field input:focus,.field textarea:focus{border-color:var(--gold)}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;background:linear-gradient(110deg,#e4c77f,#bd9140);color:#111722}.btn.secondary{background:#1a2638;border:1px solid var(--line);color:#e5ebf4}.btn.danger{background:#3a2026;color:#ffb4b4;border:1px solid #6b343e}.btn:disabled{opacity:.5;cursor:not-allowed}.wide{width:100%}.notice{border:1px solid #6a5430;background:#2b2418;color:#f1d89c;padding:12px;border-radius:9px;font-size:.84rem;line-height:1.5;margin:16px 0}.error{color:#ff9999;font-size:.85rem;min-height:20px}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#0c121e;border-right:1px solid var(--line);padding:23px 16px;display:flex;flex-direction:column;gap:22px}.side-brand{padding:0 10px 18px;border-bottom:1px solid var(--line)}.side-brand small{display:block;color:var(--muted);font-size:.65rem;letter-spacing:2px;margin-top:5px}.nav{display:grid;gap:6px}.nav button{background:transparent;border:0;color:#b7c2d2;text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#1a2638;color:var(--gold)}.side-bottom{margin-top:auto}.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#0b111c}.topbar strong{font:700 1rem Manrope}.top-actions{display:flex;align-items:center;gap:12px}.content{padding:30px;max-width:1250px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.page-head h1{margin:0}.page-head p{margin:7px 0 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:19px}.stat small{color:var(--muted)}.stat strong{display:block;font:800 1.8rem Manrope;margin-top:9px;color:var(--gold)}.panel{margin-top:18px}.panel h2{font-size:1.05rem;margin:0 0 14px}.muted{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:550px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:.86rem}th{color:var(--muted);font-weight:600}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#1c2b3b;color:#a9cfff;font-size:.72rem}.empty{padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:7px 10px;font-size:.78rem}.editor{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.editor .full{grid-column:1/-1}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.toast{position:fixed;right:20px;bottom:20px;background:#172638;border:1px solid #38516e;padding:13px 17px;border-radius:9px;box-shadow:0 10px 35px #0008;z-index:10}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{padding:12px;position:sticky;top:0;z-index:4;border-right:0;border-bottom:1px solid var(--line)}.side-brand{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.side-bottom{display:none}.grid{grid-template-columns:repeat(2,1fr)}.topbar{height:62px;padding:0 18px}.content{padding:20px}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat strong{font-size:1.4rem}.content{padding:16px}.page-head{display:block}.page-head .btn{margin-top:12px}.editor{grid-template-columns:1fr}.editor .full{grid-column:auto}.login-card{padding:23px}}
</style>
</head>
<body>
<section id="login" class="login-wrap"><div class="login-card">
<div class="brand">QzzCity<span>Digital</span></div><div class="eyebrow">Private administration</div>
<h1>Welcome back.</h1><p>Sign in to manage your digital business platform.</p>
<div class="notice">The secure database connection must be configured before sign-in can work. This page does not store passwords or pretend to authenticate you.</div>
<form id="loginForm"><div class="field"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn wide" id="loginBtn">Sign in securely</button><div id="loginError" class="error"></div></form>
</div></section>
<div id="app" class="app hidden">
<aside class="sidebar"><div class="side-brand"><div class="brand">QzzCity<span>Digital</span></div><small>BUSINESS CONTROL CENTRE</small></div>
<nav class="nav" id="nav">
<button class="active" data-page="overview">▦ &nbsp; Overview</button><button data-page="services">◇ &nbsp; Services</button><button data-page="pricing">R &nbsp; Pricing</button><button data-page="portfolio">▣ &nbsp; Portfolio</button><button data-page="testimonials">☆ &nbsp; Testimonials</button><button data-page="enquiries">✉ &nbsp; Enquiries</button><button data-page="settings">⚙ &nbsp; Business settings</button>
</nav><div class="side-bottom"><button class="btn secondary wide" id="logoutBtn">Sign out</button></div></aside>
<main class="main"><header class="topbar"><strong id="topTitle">Overview</strong><div class="top-actions"><span class="muted" id="adminEmail"></span><button class="btn secondary small" id="topLogout">Sign out</button></div></header><div class="content" id="view"></div></main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script type="module" src="./app.js"></script>
</body></html>
